<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>社内マップ 3D（歩ける版・試作）</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#b9d3e6;font-family:"Yu Gothic UI","Hiragino Sans",Meiryo,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.panel{position:fixed;background:rgba(20,30,24,.78);color:#fff;border-radius:10px;font-size:13px;line-height:1.5}
#dai{left:10px;top:10px;padding:7px 12px;font-weight:700}
#dai small{display:block;font-weight:400;font-size:11px;opacity:.85}
#basho{left:10px;top:64px;padding:6px 12px;font-size:15px;font-weight:700;display:none;background:rgba(46,139,87,.92)}
#btns{right:10px;top:10px;display:flex;gap:6px;background:none}
#btns button{border:0;border-radius:10px;background:rgba(20,30,24,.78);color:#fff;font-size:13px;font-weight:700;padding:9px 11px;font-family:inherit}
#mini{position:fixed;right:10px;top:58px;width:150px;height:116px;border-radius:8px;background:rgba(255,255,255,.88);border:2px solid rgba(20,30,24,.6)}
#list{right:10px;top:58px;width:min(300px,84vw);max-height:70vh;overflow:auto;padding:6px;display:none;touch-action:pan-y;z-index:5}
#list button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid rgba(255,255,255,.15);background:none;color:#fff;font-size:14px;padding:9px 8px;font-family:inherit}
#list button b{display:inline-block;min-width:2.2em;color:#ffd76a}
#help{left:50%;bottom:14px;transform:translateX(-50%);padding:7px 14px;white-space:nowrap;font-size:12px;pointer-events:none}
#stick{position:fixed;left:18px;bottom:22px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.25);border:2px solid rgba(255,255,255,.7);display:none}
#stick i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px;border-radius:50%;background:rgba(255,255,255,.85)}
#err{left:10px;right:10px;bottom:60px;padding:8px 12px;background:rgba(160,30,30,.92);display:none;white-space:pre-wrap;z-index:9}
#uehint{left:10px;top:58px;padding:6px 11px;font-size:12px;display:none;pointer-events:none}
#b-muki{position:fixed;right:10px;top:182px;border:0;border-radius:10px;background:rgba(20,30,24,.78);color:#fff;font-size:13px;font-weight:700;padding:9px 11px;font-family:inherit;display:none}
#yomi{left:50%;top:50%;transform:translate(-50%,-50%);padding:14px 22px;font-size:15px}
@media (max-width:600px){#dai{top:auto;bottom:10px;left:auto;right:10px;font-size:11px;padding:5px 9px;opacity:.85}#dai small{display:none}#btns{left:10px;right:auto}#basho{top:58px}}
@media (pointer:coarse){#stick{display:block}#help{bottom:auto;top:58px;left:10px;transform:none;display:none}}
</style>
</head>

<div id="btns" class="panel"><button id="b-list">📍 場所へ行く</button><button id="b-ue">🛰 上から</button><button id="b-fuda">🏷 札</button></div>
<canvas id="mini" width="300" height="232"></canvas>
<div id="list" class="panel"></div>
<div id="help" class="panel">移動：W A S D ／ 矢印　見回す：マウスをドラッグ　走る：Shift</div>

<button id="b-muki">↻ 向きを回す</button>
<div id="stick"><i></i></div>
<div id="yomi" class="panel">読み込み中…</div>

   3) 事務所の東の階段の向きを逆に（北から南へ上る） */
(function(){
function go(){
  if(!window.__ready||!window.DBG){ setTimeout(go,80); return; }
  try{ run(); }catch(e){ var b=document.getElementById('err'); if(b){ b.style.display='block'; b.textContent='直しのエラー：'+(e&&e.message||e); } }
}
function run(){
  var scene=DBG.scene, by={}, sun=null;
  scene.traverse(function(o){ if(o.isMesh) by[o.name.replace(/_\d+$/,'')]=o; if(o.isDirectionalLight) sun=o; });
  var jari=by.jari, Mesh=jari.constructor, Geo=jari.geometry.constructor, Std=jari.material.constructor, Attr=jari.geometry.attributes.uv.constructor;

  function mk(tri,mat,uvk,shadow){
    var n=tri.length/3, nor=new Float32Array(tri.length);
    for(var i=0;i<n;i+=3){
      var ax=tri[i*3],ay=tri[i*3+1],az=tri[i*3+2], bx=tri[i*3+3]-ax,by2=tri[i*3+4]-ay,bz=tri[i*3+5]-az, cx=tri[i*3+6]-ax,cy=tri[i*3+7]-ay,cz=tri[i*3+8]-az;
      var nx=by2*cz-bz*cy, ny=bz*cx-bx*cz, nz=bx*cy-by2*cx, l=Math.hypot(nx,ny,nz)||1; nx/=l; ny/=l; nz/=l;
      for(var k=0;k<3;k++){ nor[(i+k)*3]=nx; nor[(i+k)*3+1]=ny; nor[(i+k)*3+2]=nz; }
    }
    var g=new Geo(); g.setAttribute('position',new Attr(new Float32Array(tri),3)); g.setAttribute('normal',new Attr(nor,3));
    if(uvk){ var uv=new Float32Array(n*2); for(var j=0;j<n;j++){ uv[j*2]=tri[j*3]*uvk; uv[j*2+1]=tri[j*3+2]*uvk; } g.setAttribute('uv',new Attr(uv,2)); }
    var m=new Mesh(g,mat); m.receiveShadow=true; m.castShadow=!!shadow; scene.add(m); return m;
  }
  function quad(t,a,b,c,d){ t.push(a[0],a[1],a[2],b[0],b[1],b[2],c[0],c[1],c[2], a[0],a[1],a[2],c[0],c[1],c[2],d[0],d[1],d[2]); }
  function hexa(t,p){ /* p＝8つの角（0-3 下・4-7 上） */
    quad(t,p[0],p[3],p[2],p[1]); quad(t,p[4],p[5],p[6],p[7]); quad(t,p[0],p[1],p[5],p[4]); quad(t,p[1],p[2],p[6],p[5]); quad(t,p[2],p[3],p[7],p[6]); quad(t,p[3],p[0],p[4],p[7]);
  }
  function box(t,cx,cy,cz,hx,hy,hz){
    hexa(t,[[cx-hx,cy-hy,cz-hz],[cx+hx,cy-hy,cz-hz],[cx+hx,cy-hy,cz+hz],[cx-hx,cy-hy,cz+hz],[cx-hx,cy+hy,cz-hz],[cx+hx,cy+hy,cz-hz],[cx+hx,cy+hy,cz+hz],[cx-hx,cy+hy,cz+hz]]);
  }
  function beam(t,x,y0,z0,y1,z1,w,th){ /* 南北と上下の面の中で斜めに渡す棒 */
    var dy=y1-y0, dz=z1-z0, L=Math.hypot(dy,dz)||1, uy=dy/L, uz=dz/L, vy=uz*th/2, vz=-uy*th/2, hw=w/2;
    hexa(t,[[x-hw,y0-vy,z0-vz],[x+hw,y0-vy,z0-vz],[x+hw,y1-vy,z1-vz],[x-hw,y1-vy,z1-vz],[x-hw,y0+vy,z0+vz],[x+hw,y0+vy,z0+vz],[x+hw,y1+vy,z1+vz],[x-hw,y1+vy,z1+vz]]);
  }
  function mat(c,r,me){ return new Std({color:c,roughness:r==null?0.7:r,metalness:me||0,side:2}); }

  /* 1) 砂利の道：x -0.84〜4.2・北（z -10.78）で 0.2m 高い → 南（z 3.15）で地面に戻る。北の通り道の上は なだらかに下る */
  var X0=-0.84,X1=4.2,ZN=-10.78,ZS=3.15,ZT=-14.0,H=0.2,E=0.03, t=[];
  quad(t,[X0,H,ZN],[X0,E,ZS],[X1,E,ZS],[X1,H,ZN]);
  quad(t,[X0,E,ZT],[X0,H,ZN],[X1,H,ZN],[X1,E,ZT]);
  [X0,X1].forEach(function(x){ t.push(x,0,ZT, x,H,ZN, x,0,ZN,  x,0,ZN, x,H,ZN, x,0,ZS); });
  mk(t,jari.material,0.45,false);

  /* 2) バックホウ（0.1・青・Zフォーク）：アームロールの箱のすぐ南・前（ブーム）は南向き */
  var cx=-1.82, cz=-2.1, ao=mat(0x1f6fd0,0.55), kuro=mat(0x2a2c2e,0.9), tetsu=mat(0x4d5154,0.6,0.3), garasu=mat(0x9fb7c4,0.2,0.3);
  var a=[],k=[],s=[],g=[];
  box(k,cx-0.6,0.24,cz,0.16,0.24,1.05); box(k,cx+0.6,0.24,cz,0.16,0.24,1.05);            /* 履帯 */
  box(s,cx,0.34,cz,0.46,0.12,0.7);                                                         /* 台 */
  box(a,cx,0.22,cz+1.22,0.78,0.17,0.04); beam(s,cx-0.4,0.3,cz+0.7,0.22,cz+1.2,0.08,0.08); beam(s,cx+0.4,0.3,cz+0.7,0.22,cz+1.2,0.08,0.08);  /* 排土板 */
  box(a,cx,0.84,cz-0.1,0.72,0.28,0.95);                                                    /* 上の体 */
  box(a,cx+0.32,1.26,cz-0.5,0.38,0.14,0.5);                                                /* エンジンのふた */
  box(k,cx,0.86,cz-1.07,0.7,0.24,0.04);                                                    /* 後ろのおもり */
  box(g,cx-0.3,1.62,cz+0.05,0.38,0.5,0.5);                                                 /* 運転席（ガラス） */
  box(a,cx-0.3,2.16,cz+0.05,0.42,0.04,0.55);                                               /* 屋根 */
  [[-0.66,-0.43],[0.06,-0.43],[-0.66,0.53],[0.06,0.53]].forEach(function(p){ box(a,cx+p[0],1.62,cz+p[1],0.03,0.5,0.03); });
  var bx=cx+0.28;
  beam(a,bx,1.15,cz+0.75,2.6,cz+2.0,0.2,0.24);                                             /* ブーム */
  beam(a,bx,2.6,cz+2.0,1.05,cz+2.75,0.16,0.18);                                            /* アーム */
  beam(s,bx,1.2,cz+1.05,2.1,cz+1.75,0.08,0.08); beam(s,bx,2.7,cz+2.05,1.9,cz+2.5,0.07,0.07);  /* シリンダー */
  box(s,bx,1.02,cz+2.76,0.32,0.06,0.06);                                                   /* フォークの付け根 */
  [-0.26,0,0.26].forEach(function(d){ beam(s,bx+d,1.0,cz+2.76,0.34,cz+2.6,0.05,0.07); beam(s,bx+d,0.34,cz+2.6,0.14,cz+3.2,0.05,0.07); });   /* 下のフォーク（3本） */
  [-0.13,0.13].forEach(function(d){ beam(s,bx+d,1.02,cz+2.78,0.98,cz+3.25,0.05,0.07); beam(s,bx+d,0.98,cz+3.25,0.46,cz+3.36,0.05,0.07); }); /* 上のつめ（2本） */
  mk(a,ao,0,true); mk(k,kuro,0,true); mk(s,tetsu,0,true); mk(g,garasu,0,true);

  /* 2') 細い道（人だけ）：広い道 → アームロールの箱と下の事務所の間 → 自宅と下の事務所の間を南へ → 東西の道 */
  var hoso=[]; quad(hoso,[-11.34,0.024,-4.1],[-11.34,0.024,-3.45],[-0.84,0.024,-3.45],[-0.84,0.024,-4.1]); quad(hoso,[-11.34,0.024,-3.45],[-11.34,0.024,3.15],[-10.5,0.024,3.15],[-10.5,0.024,-3.45]);
  mk(hoso,mat(0xb3a88c,1),0,false);

  /* 3) 事務所の東の階段：南北を入れ替える（真ん中 z=9.94 で鏡）。2階の戸も一緒に */
  function mirror(m,inR){
    if(!m) return; m.updateWorldMatrix(true,false);
    var e=m.matrixWorld.elements, inv=m.matrixWorld.clone().invert().elements, p=m.geometry.attributes.position, nrm=m.geometry.attributes.normal, idx=m.geometry.index, hit=new Uint8Array(p.count), ZC=9.94, any=false;
    for(var i=0;i<p.count;i++){
      var x=p.getX(i),y=p.getY(i),z=p.getZ(i), wx=e[0]*x+e[4]*y+e[8]*z+e[12], wy=e[1]*x+e[5]*y+e[9]*z+e[13], wz=e[2]*x+e[6]*y+e[10]*z+e[14];
      if(!inR(wx,wy,wz)) continue; hit[i]=1; any=true; wz=2*ZC-wz;
      p.setXYZ(i, inv[0]*wx+inv[4]*wy+inv[8]*wz+inv[12], inv[1]*wx+inv[5]*wy+inv[9]*wz+inv[13], inv[2]*wx+inv[6]*wy+inv[10]*wz+inv[14]);
      if(nrm && Math.abs(e[2])<1e-9 && Math.abs(e[6])<1e-9 && Math.abs(e[8])<1e-9 && Math.abs(e[9])<1e-9) nrm.setZ(i,-nrm.getZ(i));
    }
    if(!any) return;
    if(idx){ for(var j=0;j<idx.count;j+=3){ var b=idx.getX(j+1), c=idx.getX(j+2); if(hit[idx.getX(j)]&&hit[b]&&hit[c]){ idx.setX(j+1,c); idx.setX(j+2,b); } } idx.needsUpdate=true; }
    p.needsUpdate=true; if(nrm) nrm.needsUpdate=true; m.geometry.computeBoundingBox(); m.geometry.computeBoundingSphere();
  }
  mirror(by.yuka,function(x,y,z){ return x>-2.76&&x<-1.09&&z>7.66&&z<12.22&&y>0.06; });
  mirror(by.mado,function(x,y,z){ return x>-2.86&&x<-2.74&&z>7.8&&z<8.52&&y>2.85; });

  if(sun){ sun.shadow.needsUpdate=true; }
  window.__naoshi=true;
}
go();
})();
</script>
