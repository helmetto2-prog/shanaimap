<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>みどり造園 どこに何があるかマップ</title>
<style>
  :root { --sashi:#2e5d34; --shiro:#ffffff; --kinari:#f4f1e8; --moji:#243324; --usui:#dfe6d8; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body { font-family:"Yu Gothic UI","Hiragino Sans",Meiryo,sans-serif; background:var(--kinari); color:var(--moji);
    display:flex; flex-direction:column; line-height:1.55; }
  .head { background:var(--shiro); border-bottom:3px solid var(--sashi); padding:10px 14px; display:flex; align-items:center; gap:10px; }
  .modoru { text-decoration:none; color:var(--sashi); font-weight:bold; font-size:14px; border:2px solid var(--sashi);
    border-radius:8px; padding:6px 10px; white-space:nowrap; background:var(--shiro); }
  .badge { display:inline-block; background:var(--sashi); color:#fff; font-size:11px; font-weight:bold;
    padding:1px 9px; border-radius:3px; letter-spacing:.08em; }
  h1 { font-size:19px; line-height:1.3; }
  #map { flex:1; min-height:240px; background:#cfd8c8; }
  #map iframe { width:100%; height:100%; border:0; display:block; }
  .info { background:var(--shiro); border-top:3px solid var(--sashi); padding:12px 14px 16px; }
  .info p { font-size:14px; }
  .info .memo { font-weight:bold; margin-top:2px; }
  .mono { margin-top:6px; font-size:14px; }
  .mono b { color:var(--sashi); }
  .btns { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .btn { flex:1; min-width:140px; text-align:center; text-decoration:none; font-size:15px; font-weight:bold; padding:11px 8px;
    border-radius:8px; border:2px solid var(--sashi); color:var(--sashi); background:var(--shiro); cursor:pointer; font-family:inherit; }
  .btn.omo { background:var(--sashi); color:#fff; }
  .nai { padding:30px 18px; text-align:center; font-size:15px; }
</style>
</head>
<body>
<header class="head">
  <a class="modoru" id="modoru" href="./">‹ 一覧</a>
  <div><span class="badge">どこに何があるかマップ</span><h1 id="namae"></h1></div>
</header>
<div id="map"></div>
<section class="info" id="info"></section>

<script src="basho.js"></script>
<script>
function esc(t){ return String(t).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
/* アドレスの # の後ろ：b=場所の id ／ w=名前（ホームから渡された物・一覧へ戻る時にそのまま返す） */
window.addEventListener('hashchange', function(){ location.reload(); });   // 場所だけ変わった時は読み直す
const H = location.hash || '';
const bid = (/[#&]b=([^&]+)/.exec(H) || [])[1] || '';
const wm = /[#&](w=[^&]+)/.exec(H);
document.getElementById('modoru').setAttribute('href', './' + (wm ? '#' + wm[1] : ''));
const b = BASHO.filter(x=>x.id === bid && x.lat)[0];
const info = document.getElementById('info');
if(!b){
  document.getElementById('namae').textContent = '場所が見つかりません';
  document.getElementById('map').style.display = 'none';
  info.innerHTML = '<p class="nai">一覧へ戻って、場所を選び直してください。</p>';
} else {
  document.title = 'みどり造園 ' + b.name;
  document.getElementById('namae').textContent = b.name;
  const g = 'https://www.google.com/maps/search/?api=1&query=' + b.lat + ',' + b.lng;
  info.innerHTML =
    (b.jusho ? '<p>' + esc(b.jusho) + '</p>' : '') +
    (b.memo ? '<p class="memo">' + esc(b.memo) + '</p>' : '') +
    (b.items && b.items.length ? '<p class="mono"><b>ある物</b>　' + b.items.map(esc).join('・') + '</p>' : '') +
    '<div class="btns"><a class="btn omo" target="_blank" rel="noopener" href="' + g + '">Googleマップで開く</a>' +
    '<button class="btn" id="kirikae" type="button">地図に切りかえ</button></div>';
  /* 地図＝Google の地図をそのまま出す（写真と地図を切りかえ） */
  const mapEl = document.getElementById('map');
  function dasu(k){
    mapEl.innerHTML = '<iframe title="' + esc(b.name) + ' の地図" loading="lazy" allowfullscreen referrerpolicy="no-referrer-when-downgrade" src="https://www.google.com/maps?q=' +
      b.lat + ',' + b.lng + '&z=18&t=' + k + '&hl=ja&output=embed"></iframe>';
  }
  let ima = 'k';   // k＝写真 ／ m＝地図
  dasu(ima);
  document.getElementById('kirikae').addEventListener('click', function(){
    ima = (ima === 'k') ? 'm' : 'k';
    dasu(ima);
    this.textContent = (ima === 'k') ? '地図に切りかえ' : '写真に切りかえ';
  });
}
</script>
</body>
</html>
