<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>みどり造園 社内マップ（スマホ横）</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body { font-family:"Yu Gothic UI","Hiragino Sans",Meiryo,sans-serif; background:#dfe3da; color:#243324;
    overflow-x:hidden; }

  /* ===== 透過フローティングタイトル（地図の上に薄く重ねる・邪魔にならない） ===== */
  .titlebar {
    position:fixed; top:8px; left:8px; z-index:60;
    display:flex; align-items:center; gap:8px;
    background:rgba(46,93,52,.55); color:#fff; backdrop-filter:blur(4px);
    -webkit-backdrop-filter:blur(4px);
    padding:6px 12px; border-radius:20px; box-shadow:0 1px 6px rgba(0,0,0,.25);
    font-size:13px; font-weight:bold; cursor:pointer; user-select:none;
    transition:opacity .2s, transform .2s; max-width:calc(100vw - 16px);
  }
  .titlebar .sub { font-size:10px; font-weight:normal; opacity:.9; }
  .titlebar.min { opacity:.5; }
  .titlebar.min .txt { display:none; }

  /* ===== フローティング操作バー（右上・コンパクト・半透明） ===== */
  .toolbar {
    position:fixed; top:8px; right:8px; z-index:60;
    display:flex; gap:6px; align-items:center; flex-wrap:wrap; justify-content:flex-end;
    max-width:calc(100vw - 16px);
  }
  .toolbar input[type="text"] {
    width:150px; padding:7px 12px; border:none; border-radius:18px;
    font-size:14px; outline:none; background:rgba(255,255,255,.9); box-shadow:0 1px 4px rgba(0,0,0,.2);
  }
  .modebtn {
    font-size:12px; padding:7px 11px; border-radius:18px; border:none;
    background:rgba(255,255,255,.9); color:#2e5d34; cursor:pointer; user-select:none;
    box-shadow:0 1px 4px rgba(0,0,0,.2); white-space:nowrap;
  }
  .modebtn.on { background:#c8a24a; color:#fff; }

  /* ===== フローティング凡例（左下・半透明） ===== */
  .legend {
    position:fixed; left:8px; bottom:8px; z-index:55;
    display:flex; gap:12px; padding:5px 12px; font-size:11px; color:#243324; align-items:center;
    background:rgba(255,255,255,.82); border-radius:16px; box-shadow:0 1px 5px rgba(0,0,0,.18);
    backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
  }
  .legend span { display:inline-flex; align-items:center; gap:4px; }
  .legend i { width:12px; height:12px; border-radius:50%; display:inline-block; border:2px solid #fff;
    box-shadow:0 0 2px rgba(0,0,0,.4); }
  .legend i.r{ background:#d84a3a;} .legend i.b{ background:#1e78c8;} .legend i.g{ background:#c8a24a;}

  /* ===== 地図（横画面で高さいっぱいに収める） ===== */
  .map-wrap { display:flex; justify-content:center; align-items:center; min-height:100vh;
    min-height:100dvh; padding:4px; }
  .map-inner { position:relative; width:100%;
    max-width:calc(96vh * 1.381); max-width:calc(96dvh * 1.381); /* 950/720=1.319 */
  }
  .map-inner svg { width:100%; display:block; border-radius:10px; box-shadow:0 2px 10px rgba(0,0,0,.2); }
  .map-inner img.aerial { width:100%; display:none; border-radius:10px; box-shadow:0 2px 10px rgba(0,0,0,.2); }
  body.photo .map-inner svg { display:none; }
  body.photo .map-inner img.aerial { display:block; }

  .pin { position:absolute; transform:translate(-50%,-50%); cursor:pointer; z-index:5;
    display:flex; flex-direction:column; align-items:center; }
  .pin .dot {
    width:22px; height:22px; border-radius:50%;
    background:#d84a3a; border:2px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.55);
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:11px; font-weight:bold;
  }
  .pin.f2 .dot { background:#1e78c8; }
  .pin .lbl {
    margin-top:2px; background:rgba(255,255,255,.92); color:#243324; font-size:9px; font-weight:bold;
    padding:1px 5px; border-radius:7px; white-space:nowrap; box-shadow:0 1px 2px rgba(0,0,0,.4);
    max-width:110px; overflow:hidden; text-overflow:ellipsis;
  }
  body:not(.showlbl) .pin .lbl { display:none; }
  .pin.hit .dot { background:#c8a24a; transform:scale(1.15); }
  /* 枝番（29-1 など）：字が長いので横長の丸に */
  .pin.sub .dot { width:auto; min-width:22px; padding:0 4px; border-radius:11px; font-size:9px; background:#b8532f; }
  .pin.sub.hit .dot { background:#c8a24a; }
  .card.sub .num { font-size:9px; background:#b8532f; }
  .card .nophoto { flex:none; width:42px; height:42px; border-radius:6px; background:#eceee6; color:#9aa58f;
    font-size:9px; display:flex; align-items:center; justify-content:center; text-align:center; }
  .viewer .vnone { position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    color:#fff; font-size:15px; opacity:.8; }
  .viewer.nophoto .vnone { display:flex; }
  .viewer.nophoto img.vimg { opacity:0; }
  .pin.dim { opacity:.25; }

  /* ===== 場所一覧（地図の下・スクロールで表示） ===== */
  .list { padding:14px 12px 40px; max-width:900px; margin:0 auto; }
  .list h2 { font-size:14px; color:#2e5d34; margin:6px 2px 8px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; }
  .card {
    background:#fff; border-radius:10px; padding:8px 10px; cursor:pointer;
    box-shadow:0 1px 4px rgba(0,0,0,.08); display:flex; align-items:center; gap:9px;
  }
  .card .num {
    flex:none; width:26px; height:26px; border-radius:50%; background:#d84a3a; color:#fff;
    font-size:12px; font-weight:bold; display:flex; align-items:center; justify-content:center;
  }
  .card.f2 .num { background:#1e78c8; }
  .card.hit .num { background:#c8a24a; }
  .card .nm { font-size:14px; font-weight:bold; }
  .card .fl { font-size:10px; color:#7a8f7a; margin-top:1px; }
  .card.hidden { display:none; }
  .card .thumb { flex:none; width:42px; height:42px; border-radius:6px; object-fit:cover; }

  /* ===== 写真ビューア（拡大→全体→閉じる） ===== */
  .viewer { position:fixed; inset:0; background:rgba(0,0,0,.92); z-index:200; display:none; }
  .viewer.show { display:block; }
  .viewer img.vimg {
    position:absolute; top:0; left:0; width:100%; height:100%; cursor:pointer;
    transition:none;
  }
  .viewer img.vimg.zoom { object-fit:cover; }   /* 拡大＝画面いっぱい（端が切れる） */
  .viewer img.vimg.fit  { object-fit:contain; } /* 全体＝写真全部が見える */
  .vtop {
    position:absolute; top:0; left:0; right:0; z-index:2;
    display:flex; align-items:center; gap:10px; padding:10px 12px;
    background:linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,0)); color:#fff; pointer-events:none;
  }
  .vtop .vname { font-size:15px; font-weight:bold; flex:1; }
  .vtop .vstate { font-size:11px; background:rgba(255,255,255,.22); padding:3px 10px; border-radius:12px; }
  .vtop .vclose { pointer-events:auto; background:rgba(255,255,255,.25); border:none; color:#fff;
    width:34px; height:34px; border-radius:50%; font-size:17px; cursor:pointer; }
  .vnav {
    position:absolute; top:50%; transform:translateY(-50%); z-index:2;
    width:44px; height:64px; border:none; border-radius:10px;
    background:rgba(255,255,255,.16); color:#fff; font-size:30px; cursor:pointer; line-height:1;
  }
  .vnav.prev { left:8px; } .vnav.next { right:8px; }
  .vhint { position:absolute; bottom:14px; left:0; right:0; text-align:center; color:#fff;
    font-size:12px; opacity:.85; pointer-events:none; z-index:2; }


  /* ===== タッチ端末（スマホ・タブレット）：ピンとボタンを押しやすい大きさに ===== */
  @media (pointer:coarse) {
    /* 2026-11-15 番号を半分の大きさに（32px→16px）。重なる所は「＋ 大きく」で地図を広げて押す */
    .pin .dot { width:16px; height:16px; font-size:9px; border-width:1.5px; }
    .pin .lbl { font-size:9px; max-width:96px; padding:1px 4px; }
    .pin.sub .dot { min-width:16px; padding:0 3px; font-size:8px; }
    .toolbar input[type="text"] { width:170px; padding:11px 14px; font-size:16px; }
    .modebtn { font-size:14px; padding:11px 14px; }
    .titlebar { font-size:14px; padding:9px 14px; }
    .legend { font-size:12px; padding:8px 14px; gap:14px; }
    .legend i { width:14px; height:14px; }
    .vnav { width:60px; height:88px; font-size:38px; }
    .vtop .vclose { width:44px; height:44px; font-size:20px; }
    .vtop .vname { font-size:16px; }
    .vhint { font-size:14px; }
    .card { padding:12px; }
    .card .num { width:30px; height:30px; font-size:13px; }
  }

  /* ===== 地図を広げた時（＋ 大きく）：横にも縦にも指で動かせる ===== */
  .map-wrap.zoomed { justify-content:flex-start; align-items:flex-start; overflow:auto;
    height:100vh; height:100dvh; -webkit-overflow-scrolling:touch; }
  .map-wrap.zoomed .map-inner { flex:none; max-width:none; }
  .zoomlv { font-size:11px; opacity:.8; }

  /* ===== 検索の結果（検索の欄のすぐ下） ===== */
  .hits { display:none; position:fixed; top:52px; right:8px; z-index:61; width:320px; max-width:calc(100vw - 16px);
    max-height:62vh; overflow:auto; background:#fff; border-radius:12px; box-shadow:0 2px 10px rgba(0,0,0,.25); padding:6px; }
  .hits.show { display:block; }
  .hits .hhd { font-size:12px; color:#2e5d34; font-weight:bold; padding:4px 6px; }
  .hits .hno { font-size:13px; color:#7a8f7a; padding:6px; }
  .hits .hrow { display:flex; align-items:center; gap:9px; padding:9px 6px; border-top:1px solid #eceee6; cursor:pointer; }
  .hits .hn { flex:none; min-width:30px; height:26px; padding:0 6px; border-radius:13px; background:#c8a24a; color:#fff;
    font-size:12px; font-weight:bold; display:flex; align-items:center; justify-content:center; }
  .hits b { font-size:15px; display:block; }
  .hits small { font-size:12px; color:#8a6a1a; display:block; margin-top:1px; }

  /* ===== スマホを縦に持った時：上の帯を重ねずに並べる ===== */
  @media (orientation:portrait) and (max-width:700px) {
    .titlebar, .toolbar, .legend { position:static; }
    .titlebar { margin:8px 8px 0; border-radius:12px; background:rgba(46,93,52,.9); max-width:none; }
    .titlebar .sub { display:block; margin-top:1px; }
    .toolbar { margin:8px 8px 0; max-width:none; justify-content:flex-start; }
    .toolbar input[type="text"] { flex:1 1 100%; width:auto; }
    .hits { position:static; width:auto; max-width:none; margin:8px 8px 0; max-height:46vh; }
    .map-wrap { min-height:0; padding:8px 4px; display:block; }
    .map-wrap.zoomed { height:auto; max-height:72vh; max-height:72dvh; }
    .legend { margin:0 8px; display:inline-flex; }
  }

  /* ===== 写真の下に出す「ここにある物・特徴」 ===== */
  .vinfo { position:absolute; left:0; right:0; bottom:0; z-index:2; color:#fff;
    background:linear-gradient(rgba(0,0,0,0), rgba(0,0,0,.78) 26%); padding:26px 14px 12px;
    max-height:46%; overflow:auto; }
  .vinfo h4 { font-size:12px; font-weight:bold; color:#f0d58a; margin:6px 0 4px; }
  .vinfo ul { list-style:none; display:flex; flex-wrap:wrap; gap:6px; }
  .vinfo li { font-size:14px; background:rgba(255,255,255,.2); padding:4px 10px; border-radius:12px; }
  .vinfo p { font-size:14px; line-height:1.5; }
  .vinfo .none { font-size:12px; opacity:.75; }
  .vinfo .vhint { position:static; text-align:right; margin-top:8px; }
  .card .it { font-size:11px; color:#8a6a1a; margin-top:2px; }

  /* ===== A4印刷（縦）：1枚目=平面図、2枚目以降=場所一覧 ===== */
  @media print {
    @page { size: A4 portrait; margin: 10mm; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body { background:#fff; overflow:visible; }
    .toolbar, .titlebar, .legend, .viewer, .hits { display:none !important; }
    .map-wrap { min-height:auto; page-break-after:always; }
    .map-inner { max-width:100%; }
    body .pin .lbl { display:block !important; }
    .pin.dim { opacity:1; }
    .pin.hit .dot { background:#d84a3a; transform:none; }
    .card { box-shadow:none; border:1px solid #bbb; page-break-inside:avoid; }
    .card.hidden { display:flex !important; }
    .card .thumb { display:none; }
  }
</style>
</head>
<body class="showlbl">

<!-- 透過タイトル（タップで最小化して完全に地図の邪魔を消せる） -->
<div class="titlebar" id="titlebar" onclick="this.classList.toggle('min')">
  🌲<span class="txt">みどり造園 社内マップ<span class="sub">　名前は仮です／良い呼び名は水野まで</span></span>
</div>

<div class="toolbar">
  <input type="text" id="q" placeholder="🔍 場所・道具を検索">
  <div class="modebtn" id="bgBtn" onclick="toggleBg()">📷 航空写真</div>
  <div class="modebtn on" id="lblBtn" onclick="toggleLbl()">🏷️ 名前</div>
  <div class="modebtn" onclick="zoomMap(1)">＋ 大きく</div>
  <div class="modebtn" onclick="zoomMap(-1)">− 小さく <span class="zoomlv" id="zoomLv"></span></div>
  <div class="modebtn" onclick="window.print()">🖨️</div>
</div>

<div class="hits" id="hits"></div>

<div class="legend">
  <span><i class="r"></i>1階・屋外</span>
  <span><i class="b"></i>2階</span>
  <span><i class="g"></i>ヒット</span>
</div>

<div class="map-wrap" id="mapWrap">
  <div class="map-inner" id="mapInner">
    <!-- ======== すっきり長方形の配置図 ======== -->
    <svg viewBox="0 0 994 720" xmlns="http://www.w3.org/2000/svg" font-family="'Yu Gothic UI','Hiragino Sans',Meiryo,sans-serif">
      <!-- 下地 -->
      <rect x="0" y="0" width="994" height="720" fill="#e6e2d6"/>

      <!-- 線路（西端） -->
      <rect x="0" y="0" width="18" height="720" fill="#b9b2a4"/>
      <line x1="6" y1="0" x2="6" y2="720" stroke="#7d766a" stroke-width="2"/>
      <line x1="13" y1="0" x2="13" y2="720" stroke="#7d766a" stroke-width="2"/>

      <!-- 西の道路 -->
      <rect x="18" y="0" width="44" height="720" fill="#a9aeae"/>
      <line x1="40" y1="0" x2="40" y2="720" stroke="#fff" stroke-width="2" stroke-dasharray="14 12"/>
      <text x="30" y="690" font-size="13" fill="#fff" writing-mode="tb" letter-spacing="4">道　路</text>
      <!-- 2026-11-15 東の道路（西の道路と同じアスファルトの道・地図の幅を 950→994 に広げた） -->
      <polygon points="938,0 982,0 994,150 994,330 938,170" fill="#a9aeae"/>
      <polyline points="960,0 960,150 994,245" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="14 12"/>
      <rect x="936" y="236" width="30" height="96" fill="#e9e4da" stroke="#8d8676" stroke-width="1.2"/>
      <text x="945" y="270" font-size="11" fill="#6d675a" writing-mode="tb" letter-spacing="3">家</text>
      <polyline points="978,300 974,420 974,720" fill="none" stroke="#c9b98f" stroke-width="8"/>
      <text x="970" y="470" font-size="10" fill="#7a6b3f" writing-mode="tb" letter-spacing="4">遊歩道</text>
      
      <text x="950" y="40" font-size="13" fill="#fff" writing-mode="tb" letter-spacing="4">道　路</text>

      <!-- ▼▼ 敷地（長方形） ▼▼ -->
      <rect x="70" y="30" width="860" height="660" fill="#f0f5e3" stroke="#5f8f4e" stroke-width="3" stroke-dasharray="10 6"/>

      <!-- 通り道（自宅の北側・横断） -->
      <rect x="70" y="160" width="860" height="46" fill="#e3e8d2"/>
      <text x="640" y="190" font-size="14" fill="#9aa88a" letter-spacing="6">通　り　道</text>
      <!-- 広い道（第二更衣室にぶつかって南端で止まる・中型車2台並走） -->
      <rect x="488" y="206" width="72" height="404" fill="#e0e5cd"/>
      <line x1="524" y1="210" x2="524" y2="606" stroke="#fff" stroke-width="1.5" stroke-dasharray="12 10"/>
      <text x="516" y="250" font-size="11" fill="#9aa88a" writing-mode="tb" letter-spacing="2">広い道（中型車２台）</text>
      <rect x="70" y="405" width="860" height="30" fill="#e3e8d2"/>
      <!-- 自宅へ通じる通路（工具庫と事務所の間） -->
      <rect x="294" y="340" width="36" height="280" fill="#e3e8d2"/>
      <text x="318" y="400" font-size="11" fill="#9aa88a" writing-mode="tb" letter-spacing="3">自宅へ</text>
      <!-- 工具庫の南の通路 -->
      <rect x="70" y="556" width="260" height="26" fill="#e3e8d2"/>
      <text x="150" y="574" font-size="11" fill="#9aa88a" letter-spacing="4">通　路</text>
      <!-- 正面入口 → フートン置き場の北側へ 真っすぐの道 -->
      <rect x="95" y="588" width="480" height="18" fill="#e3e8d2"/>
      <text x="250" y="601" font-size="11" fill="#9aa88a" letter-spacing="3">正面入口 →　フートンへ</text>

      <!-- ◆ 左上：北入口 -->
      <rect x="70" y="42" width="8" height="60" fill="#f0f5e3"/>
      <text x="84" y="66" font-size="14" fill="#c0392b" font-weight="bold">⬅ 北入口</text>

      <!-- 寮（車1台分ぶん右へ延長 w92→132・右辺242） -->
      <!-- 2026-11-15 寮の左（西）に4台ほどの駐車スペース・寮の左下の角にゴミ置き場（寮は右へ40） -->
      <rect x="80" y="72" width="64" height="45" fill="#dfe6db" stroke="#9aa895" stroke-dasharray="6 4"/>
      <g stroke="#b7c2b1" stroke-width="2"><line x1="84" y1="87" x2="140" y2="87"/><line x1="84" y1="102" x2="140" y2="102"/></g>
      <text x="92" y="98" font-size="9" fill="#5a6e5a">駐車3台</text>
      <rect x="150" y="55" width="132" height="83" fill="#dcd4c0" stroke="#6d675a" stroke-width="1.5"/>
      <rect x="100" y="120" width="46" height="18" fill="#c9c4b4" stroke="#6d675a" stroke-width="1.5"/>
      <text x="106" y="133" font-size="8" fill="#4a4436">ゴミ置場</text>
      <text x="208" y="110" font-size="14" fill="#4a4436">寮</text>

      <!-- 北社員駐車場（通り道の北・寮と会長畑の間いっぱいに拡張＝たくさん停める） -->
      <rect x="290" y="55" width="465" height="90" fill="#dfe6db" stroke="#9aa895" stroke-dasharray="6 4"/>
      <g stroke="#b7c2b1" stroke-width="2">
        
        <line x1="318" y1="60" x2="318" y2="140"/><line x1="354" y1="60" x2="354" y2="140"/>
        <line x1="390" y1="60" x2="390" y2="140"/><line x1="426" y1="60" x2="426" y2="140"/>
        <line x1="462" y1="60" x2="462" y2="140"/><line x1="498" y1="60" x2="498" y2="140"/>
        <line x1="534" y1="60" x2="534" y2="140"/><line x1="570" y1="60" x2="570" y2="140"/>
        <line x1="606" y1="60" x2="606" y2="140"/><line x1="642" y1="60" x2="642" y2="140"/>
        <line x1="678" y1="60" x2="678" y2="140"/><line x1="714" y1="60" x2="714" y2="140"/>
      </g>
      <text x="330" y="50" font-size="13" fill="#5a6e5a">北社員駐車場（拡張）</text>

      <!-- ◆ 右上：会長畑 -->
      <g transform="translate(0,24)"><!-- 2026-11-15 会長畑を下へ24＝下の通り道は狭い -->
      <rect x="760" y="31" width="155" height="134" fill="#cfe5b4" stroke="#7fa456" stroke-width="1.5"/>
      <g stroke="#9ec176" stroke-width="2.5">
        <line x1="770" y1="68" x2="905" y2="68"/><line x1="770" y1="90" x2="905" y2="90"/>
        <line x1="770" y1="112" x2="905" y2="112"/><line x1="770" y1="134" x2="905" y2="134"/>

const KX = 950/994;   // 2026-11-15 東の道路の分だけ地図を右へ広げた（番号の位置は元の幅 950 で書いてある）
const mapInner = document.getElementById('mapInner');
const cards = document.getElementById('cards');
let curIdx = null;
let vState = 'zoom';   // 'zoom'(拡大) → 'fit'(全体) → 閉じる

/* 検索：ひらがな・カタカナ・全角半角・大文字小文字・空白のちがいを気にせず当てる（「しろなわ」は当たらない＝漢字の読みまでは見ない） */
function norm(t){
  return String(t||'').normalize('NFKC').toLowerCase().replace(/[\s　・\-‐ー−]/g,'')
    .replace(/[ァ-ヶ]/g, c=>String.fromCharCode(c.charCodeAt(0)-0x60));
}
function hitItems(s, q){ const n=norm(q); return n ? (s.items||[]).filter(i=>norm(i).includes(n)) : []; }
function isHit(s, q){
  const n = norm(q); if(!n) return false;
  return norm(s.name).includes(n) || norm(s.no).includes(n) || hitItems(s,q).length>0 || norm(s.memo).includes(n);
}
/* 検索の結果を、検索の欄のすぐ下に並べる（押すとその場所が開く） */
function showHits(q){
  const box = document.getElementById('hits');
  if(!norm(q)){ box.classList.remove('show'); box.innerHTML=''; return; }
  const rows = [];
  SPOTS.forEach((s,idx)=>{ if(isHit(s,q)) rows.push({s,idx}); });
  let h = '<div class="hhd">「'+esc(q)+'」＝ '+rows.length+'か所</div>';
  if(!rows.length) h += '<div class="hno">見つかりませんでした。まだ書いていない物かもしれません。</div>';
  rows.slice(0,20).forEach(r=>{
    const it = hitItems(r.s,q);
    h += '<div class="hrow" data-i="'+r.idx+'"><span class="hn">'+esc(r.s.no)+'</span><span><b>'+esc(r.s.name)+'</b>'
      + (it.length ? '<small>📦 '+it.map(esc).join('・')+'</small>' : '') + '</span></div>';
  });
  box.innerHTML = h; box.classList.add('show');
  box.querySelectorAll('.hrow').forEach(e=>{ e.onclick = ()=>openViewer(+e.getAttribute('data-i')); });
}
function esc(t){ return String(t).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ===== 地図を広げる・戻す（番号が重なる所を押しやすく） ===== */
const ZOOMS = [1, 1.6, 2.4, 3.2];
let zoomIdx = 0;
function zoomMap(d){
  const wrap = document.getElementById('mapWrap');
  const before = ZOOMS[zoomIdx];
  const cx = (wrap.scrollLeft + wrap.clientWidth/2) / (wrap.scrollWidth||1);
  const cy = (wrap.scrollTop + wrap.clientHeight/2) / (wrap.scrollHeight||1);
  zoomIdx = Math.max(0, Math.min(ZOOMS.length-1, zoomIdx + d));
  const z = ZOOMS[zoomIdx];
  if(z === before) return;
  if(z === 1){
    wrap.classList.remove('zoomed'); mapInner.style.width = '';
  } else {
    const base = before === 1 ? mapInner.getBoundingClientRect().width : mapInner.getBoundingClientRect().width / before;
    wrap.classList.add('zoomed'); mapInner.style.width = Math.round(base * z) + 'px';
    const wasFull = before === 1;
    wrap.scrollLeft = (wasFull ? 0.5 : cx) * wrap.scrollWidth - wrap.clientWidth/2;
    wrap.scrollTop  = (wasFull ? 0.5 : cy) * wrap.scrollHeight - wrap.clientHeight/2;
  }
  document.getElementById('zoomLv').textContent = z === 1 ? '' : '×'+z;
  render();
}
function photoMode(){ return document.body.classList.contains('photo'); }

function render(){
  mapInner.querySelectorAll('.pin').forEach(p=>p.remove());
  cards.innerHTML = '';
  const q = document.getElementById('q').value.trim();
  const pm = photoMode();
  let shown = 0;

  SPOTS.forEach((s,idx)=>{
    const hit = isHit(s,q), miss = q && !hit;
    if(!miss) shown++;

    const pin = document.createElement('div');
    const sub = String(s.no).length > 2 ? ' sub' : '';
    pin.className = 'pin' + sub + (s.floor==='2階'?' f2':'') + (hit?' hit':'') + (miss?' dim':'');
    pin.style.left = (pm ? s.ax : s.x*KX)+'%';   // KX＝地図の幅を広げた分の直し
    pin.style.top  = (pm ? s.ay : s.y)+'%';
    pin.innerHTML = `<div class="dot">${s.no}</div><div class="lbl">${s.name}</div>`;
    pin.onclick = (e)=>{ e.stopPropagation(); openViewer(idx); };
    mapInner.appendChild(pin);

    const card = document.createElement('div');
    card.className = 'card' + sub + (s.floor==='2階'?' f2':'') + (hit?' hit':'') + (miss?' hidden':'');
    card.innerHTML =
      `<div class="num">${s.no}</div>
       ${s.file ? `<img class="thumb" src="写真/thumb/${s.file}" loading="lazy">` : `<div class="nophoto">写真<br>まだ</div>`}
       <div><div class="nm">${s.name}</div><div class="fl">${s.floor}</div>${
         (s.items||[]).length ? `<div class="it">📦 ${s.items.map(esc).join('・')}</div>` : ''}</div>`;
    card.onclick = ()=>openViewer(idx);
    cards.appendChild(card);
  });
  document.getElementById('cnt').textContent = q ? shown+'/'+SPOTS.length : SPOTS.length;
  showHits(q);
  spreadPins();
}

/* ===== スマホだけ：重なった番号を少しだけ離して、どれも押せるようにする（パソコンは元の位置のまま） ===== */
const COARSE = window.matchMedia('(pointer:coarse)').matches || /[?&]coarse=1/.test(location.search);
function spreadPins(){
  if(!COARSE) return;
  const W = mapInner.clientWidth, H = mapInner.clientHeight;
  if(!W || !H) return;
  const pm = photoMode(), D = 18;   // 番号の丸 16px ＋ すき間
  const P = SPOTS.map(s=>({x:(pm?s.ax:s.x*KX)/100*W, y:(pm?s.ay:s.y)/100*H}));
  for(let n=0;n<12;n++){
    for(let i=0;i<P.length;i++) for(let j=i+1;j<P.length;j++){
      let dx=P[j].x-P[i].x, dy=P[j].y-P[i].y, d=Math.hypot(dx,dy);
      if(d>=D) continue;
      if(d<0.01){ dx=1; dy=0; d=1; }
      const m=(D-d)/2;
      P[i].x-=dx/d*m; P[i].y-=dy/d*m; P[j].x+=dx/d*m; P[j].y+=dy/d*m;
    }
  }
  mapInner.querySelectorAll('.pin').forEach((p,i)=>{
    p.style.left = Math.max(9,Math.min(W-9,P[i].x))+'px';
    p.style.top  = Math.max(9,Math.min(H-9,P[i].y))+'px';
  });
}
window.addEventListener('resize', ()=>spreadPins());

/* ===== 写真ビューア（拡大→全体→閉じる） ===== */
function openViewer(idx){
  curIdx = idx;
  vState = 'zoom';
  applyViewer();
  document.getElementById('viewer').classList.add('show');
}
function applyViewer(){
  const s = SPOTS[curIdx];
  const img = document.getElementById('vImg');
  document.getElementById('viewer').classList.toggle('nophoto', !s.file);
  if(s.file) img.src = '写真/'+s.file; else img.removeAttribute('src');
  img.className = 'vimg ' + vState;
  document.getElementById('vName').textContent = s.no+'. '+s.name+'（'+s.floor+'）';
  document.getElementById('vState').textContent = vState==='zoom' ? '拡大' : '全体';
  document.getElementById('vHint').textContent =
    vState==='zoom' ? '写真をタップで全体表示 →' : '写真をもう一度タップで閉じる';
  const items = s.items||[], memo = s.memo||'';
  let h = '<h4>📦 ここにある物</h4>';
  h += items.length ? '<ul>'+items.map(i=>'<li>'+esc(i)+'</li>').join('')+'</ul>'
                    : '<div class="none">まだ書いていません（分かったら水野まで）</div>';
  if(memo) h += '<h4>📝 この場所の特徴</h4><p>'+esc(memo)+'</p>';
  document.getElementById('vInfoBody').innerHTML = h;
}
function cycleViewer(){
  if(vState==='zoom'){ vState='fit'; applyViewer(); }
  else { closeViewer(); }
}
function navViewer(d){
  if(curIdx===null) return;
  curIdx = (curIdx + d + SPOTS.length) % SPOTS.length;
  vState = 'zoom';
  applyViewer();
}
function closeViewer(){
  curIdx = null;
  document.getElementById('viewer').classList.remove('show');
}

function toggleLbl(){
  document.body.classList.toggle('showlbl');
  document.getElementById('lblBtn').classList.toggle('on', document.body.classList.contains('showlbl'));
}
function toggleBg(){
  document.body.classList.toggle('photo');
  document.getElementById('bgBtn').textContent =
    photoMode() ? '🗺️ 平面図' : '📷 航空写真';
  render();
}

document.getElementById('q').addEventListener('input', render);
document.addEventListener('keydown', e=>{
  if(!document.getElementById('viewer').classList.contains('show')) return;
  if(e.key==='Escape') closeViewer();
  if(e.key==='ArrowLeft') navViewer(-1);
  if(e.key==='ArrowRight') navViewer(1);
});
/* スマホを縦に持った時は、名前の札を最初はしまっておく（番号が隠れるため・「🏷️ 名前」で出る） */
if(window.matchMedia('(orientation:portrait) and (max-width:700px)').matches){
  document.body.classList.remove('showlbl');
  document.getElementById('lblBtn').classList.remove('on');
}
render();
</script>
